<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="An interactive three-level chess prototype built with Three.js." />
  <title>Tri-Level Chess — Three.js</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(8, 12, 22, 0.78); --line: rgba(255, 255, 255, 0.14); --text: #ecf2ff; --muted: #9aa8c2; --accent: #68d8ff; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 50% 35%, #17223c 0%, #080b13 55%, #03050a 100%); color: var(--text); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .panel { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,.32); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    #info { top: 16px; left: 16px; width: min(330px, calc(100vw - 32px)); padding: 15px 17px; }
    h1 { font-size: 17px; margin: 0 0 7px; letter-spacing: .08em; text-transform: uppercase; }
    p { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 0; }
    #status { top: 16px; right: 16px; min-width: 190px; padding: 12px 15px; font-size: 12px; text-align: right; }
    #status strong { color: var(--accent); display: block; font-size: 13px; margin-bottom: 3px; }
    #actions { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px; display: flex; gap: 8px; }
    button { appearance: none; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.06); color: var(--text); padding: 8px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
    #legend { position: fixed; right: 18px; bottom: 18px; color: var(--muted); font-size: 11px; z-index: 9; }
    @media (max-width: 680px) { #status { top: auto; bottom: 70px; right: 12px; } #info { top: 12px; left: 12px; } #legend { display: none; } }
  </style>
</head>
<body>
  <section id="info" class="panel">
    <h1>Tri-Level Chess</h1>
    <p>Drag to orbit · Wheel to zoom · Click a piece, then any empty square to move. Click an enemy piece to capture it. Movement is intentionally sandbox-style across all three levels.</p>
  </section>
  <section id="status" class="panel" aria-live="polite"><strong id="turn">White to move</strong><span id="message">Select a piece</span></section>
  <section id="actions" class="panel"><button id="resetView" type="button">Reset view</button><button id="resetGame" type="button">Reset pieces</button></section>
  <div id="legend">Levels: A (bottom) · B (middle) · C (top)</div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070a12, 0.018);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 250);
    camera.position.set(14, 12, 17);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xbdd8ff, 0x172033, 2.1));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.1);
    keyLight.position.set(8, 18, 10); keyLight.castShadow = true; keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -16; keyLight.shadow.camera.right = 16; keyLight.shadow.camera.top = 16; keyLight.shadow.camera.bottom = -16;
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x4e8cff, 28, 38, 2); rimLight.position.set(-10, 7, -8); scene.add(rimLight);

    const BOARD_SIZE = 8, SQUARE = 1.15, LEVEL_GAP = 4.15;
    const LEVEL_Y = [-LEVEL_GAP, 0, LEVEL_GAP], LEVEL_NAMES = ['A', 'B', 'C'];
    const boardWidth = BOARD_SIZE * SQUARE;
    const boardGroup = new THREE.Group(), pieceGroup = new THREE.Group();
    scene.add(boardGroup, pieceGroup);
    const squares = [], pieces = [];
    let selectedPiece = null, currentTurn = 'white';
    const squareGeometry = new THREE.BoxGeometry(SQUARE * 0.96, 0.1, SQUARE * 0.96);
    const lightSquareMaterial = new THREE.MeshPhysicalMaterial({ color: 0xaac7e8, transparent: true, opacity: 0.28, roughness: 0.25, metalness: 0.05, transmission: 0.2, depthWrite: false });
    const darkSquareMaterial = new THREE.MeshPhysicalMaterial({ color: 0x203a5c, transparent: true, opacity: 0.42, roughness: 0.35, metalness: 0.08, transmission: 0.1, depthWrite: false });
    const squarePosition = (file, rank, level) => new THREE.Vector3((file - 3.5) * SQUARE, LEVEL_Y[level], (rank - 3.5) * SQUARE);

    function addLevelLabel(level) {
      const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 80;
      const ctx = canvas.getContext('2d'); ctx.font = '600 40px system-ui'; ctx.fillStyle = 'rgba(160, 210, 255, .85)'; ctx.fillText(`LEVEL ${LEVEL_NAMES[level]}`, 8, 52);
      const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
      sprite.scale.set(3.2, 1, 1); sprite.position.set(-boardWidth / 2 - 1.65, LEVEL_Y[level] + 0.15, 0); boardGroup.add(sprite);
    }

    function buildBoards() {
      for (let level = 0; level < 3; level++) {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(boardWidth + 0.35, 0.16, boardWidth + 0.35), new THREE.MeshPhysicalMaterial({ color: 0x6ba9d8, transparent: true, opacity: 0.11, metalness: 0.45, roughness: 0.2, transmission: 0.35, depthWrite: false }));
        frame.position.y = LEVEL_Y[level] - 0.035; boardGroup.add(frame);
        for (let rank = 0; rank < 8; rank++) for (let file = 0; file < 8; file++) {
          const square = new THREE.Mesh(squareGeometry, (file + rank) % 2 === 0 ? lightSquareMaterial : darkSquareMaterial);
          square.position.copy(squarePosition(file, rank, level)); square.userData = { kind: 'square', file, rank, level }; boardGroup.add(square); squares.push(square);
        }
        addLevelLabel(level);
      }
      const material = new THREE.MeshStandardMaterial({ color: 0x91b7d9, metalness: 0.75, roughness: 0.22, transparent: true, opacity: 0.32 });
      const geometry = new THREE.CylinderGeometry(0.045, 0.045, LEVEL_GAP * 2 + 0.5, 12), edge = boardWidth / 2 + 0.12;
      [[-edge,-edge], [edge,-edge], [-edge,edge], [edge,edge]].forEach(([x,z]) => { const post = new THREE.Mesh(geometry, material); post.position.set(x, 0, z); boardGroup.add(post); });
    }

    const whiteMaterial = new THREE.MeshPhysicalMaterial({ color: 0xf5f1e8, roughness: 0.22, metalness: 0.15, clearcoat: 0.7, clearcoatRoughness: 0.18 });
    const blackMaterial = new THREE.MeshPhysicalMaterial({ color: 0x101722, roughness: 0.2, metalness: 0.52, clearcoat: 0.65, clearcoatRoughness: 0.16 });
    const latheProfile = (points, material, segments = 32) => new THREE.Mesh(new THREE.LatheGeometry(points.map(([x,y]) => new THREE.Vector2(x,y)), segments), material);
    function addPart(group, geometry, material, y = 0) { const mesh = new THREE.Mesh(geometry, material); mesh.position.y = y; mesh.castShadow = true; mesh.receiveShadow = true; group.add(mesh); return mesh; }

    function createPiece(type, color) {
      const material = color === 'white' ? whiteMaterial : blackMaterial, group = new THREE.Group();
      group.add(latheProfile([[0,0],[.42,.04],[.48,.12],[.43,.2],[.31,.29],[.28,.36]], material));
      if (type === 'pawn') { addPart(group, new THREE.CylinderGeometry(.22,.28,.48,24), material, .56); addPart(group, new THREE.SphereGeometry(.25,24,16), material, .94); }
      else if (type === 'rook') { addPart(group, new THREE.CylinderGeometry(.27,.32,.7,24), material, .68); addPart(group, new THREE.CylinderGeometry(.4,.3,.24,8), material, 1.14); for (let i=0;i<4;i++){ const tooth=addPart(group,new THREE.BoxGeometry(.17,.22,.18),material,1.36),a=i*Math.PI/2; tooth.position.x=Math.cos(a)*.27; tooth.position.z=Math.sin(a)*.27; } }
      else if (type === 'knight') { addPart(group,new THREE.CylinderGeometry(.22,.29,.42,24),material,.55); const neck=addPart(group,new THREE.CapsuleGeometry(.2,.52,6,12),material,.94); neck.rotation.z=-.35; neck.position.x=.1; const head=addPart(group,new THREE.ConeGeometry(.28,.58,5),material,1.38); head.rotation.z=-.58; head.position.x=.19; }
      else if (type === 'bishop') { addPart(group,new THREE.CylinderGeometry(.18,.3,.62,24),material,.67); const crown=addPart(group,new THREE.SphereGeometry(.31,24,18),material,1.17); crown.scale.y=1.35; const tip=addPart(group,new THREE.ConeGeometry(.12,.32,20),material,1.58); tip.rotation.z=.22; }
      else if (type === 'queen') { addPart(group,new THREE.CylinderGeometry(.2,.32,.78,24),material,.77); addPart(group,new THREE.TorusGeometry(.29,.08,10,30),material,1.18).rotation.x=Math.PI/2; const crown=addPart(group,new THREE.ConeGeometry(.38,.45,8),material,1.38); crown.rotation.x=Math.PI; addPart(group,new THREE.SphereGeometry(.105,18,12),material,1.69); }
      else if (type === 'king') { addPart(group,new THREE.CylinderGeometry(.2,.33,.82,24),material,.79); addPart(group,new THREE.TorusGeometry(.3,.085,10,30),material,1.22).rotation.x=Math.PI/2; addPart(group,new THREE.SphereGeometry(.2,20,14),material,1.43); addPart(group,new THREE.BoxGeometry(.1,.48,.1),material,1.75); addPart(group,new THREE.BoxGeometry(.36,.1,.1),material,1.78); }
      group.scale.setScalar(.73); group.userData = { kind: 'piece', type, color, file: 0, rank: 0, level: 0 }; group.traverse(child => { if (child.isMesh) child.userData.pieceRoot = group; }); return group;
    }

    function placePiece(type, color, file, rank, level) { const piece=createPiece(type,color); Object.assign(piece.userData,{file,rank,level}); const p=squarePosition(file,rank,level); piece.position.set(p.x,p.y+.09,p.z); if(color==='black')piece.rotation.y=Math.PI; pieceGroup.add(piece); pieces.push(piece); }
    function setupPieces() { pieces.splice(0).forEach(piece=>pieceGroup.remove(piece)); const back=['rook','knight','bishop','queen','king','bishop','knight','rook']; for(let file=0;file<8;file++){placePiece(back[file],'white',file,0,0);placePiece('pawn','white',file,1,0);placePiece('pawn','black',file,6,2);placePiece(back[file],'black',file,7,2);} currentTurn='white';clearSelection();updateStatus('Select a piece'); }
    function clearSelection() { if(selectedPiece)selectedPiece.scale.setScalar(.73);selectedPiece=null;squares.forEach(square=>{if(square.userData.highlight){square.material= square.userData.originalMaterial;delete square.userData.highlight;delete square.userData.originalMaterial;}}); }
    function selectPiece(piece) { clearSelection();selectedPiece=piece;piece.scale.setScalar(.82);squares.forEach(square=>{square.userData.originalMaterial=square.material;square.userData.highlight=true;const occupied=pieceAt(square.userData.file,square.userData.rank,square.userData.level);square.material=new THREE.MeshBasicMaterial({color:occupied?0xff7b7b:0x45cfff,transparent:true,opacity:occupied?0.2:0.15,depthWrite:false});});const{type,file,rank,level}=piece.userData;updateStatus(`${capitalize(type)} selected at ${notation(file,rank,level)}`); }
    const pieceAt=(file,rank,level)=>pieces.find(p=>p.userData.file===file&&p.userData.rank===rank&&p.userData.level===level);
    const notation=(file,rank,level)=>`${LEVEL_NAMES[level]}${String.fromCharCode(97+file)}${rank+1}`;
    function moveSelected(file,rank,level){if(!selectedPiece)return;const target=pieceAt(file,rank,level);if(target===selectedPiece){clearSelection();updateStatus('Selection cleared');return;}if(target&&target.userData.color===currentTurn){selectPiece(target);return;}const from=notation(selectedPiece.userData.file,selectedPiece.userData.rank,selectedPiece.userData.level),to=notation(file,rank,level);if(target){pieceGroup.remove(target);pieces.splice(pieces.indexOf(target),1);}Object.assign(selectedPiece.userData,{file,rank,level});const d=squarePosition(file,rank,level);selectedPiece.position.set(d.x,d.y+.09,d.z);const action=target?`captured ${target.userData.type} on`:'moved to';clearSelection();currentTurn=currentTurn==='white'?'black':'white';updateStatus(`${capitalize(action)} ${to} · from ${from}`);}
    const capitalize=text=>text.charAt(0).toUpperCase()+text.slice(1);
    function updateStatus(message){document.querySelector('#turn').textContent=`${capitalize(currentTurn)} to move`;document.querySelector('#message').textContent=message;}
    buildBoards(); setupPieces();

    const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let azimuth=.68,polar=1.02,radius=24,dragging=false,moved=false,lastX=0,lastY=0;
    function updateCamera(){camera.position.set(radius*Math.sin(polar)*Math.sin(azimuth),radius*Math.cos(polar),radius*Math.sin(polar)*Math.cos(azimuth));camera.lookAt(0,0,0);} updateCamera();
    renderer.domElement.addEventListener('pointerdown',event=>{dragging=true;moved=false;lastX=event.clientX;lastY=event.clientY;renderer.domElement.setPointerCapture(event.pointerId);});
    renderer.domElement.addEventListener('pointermove',event=>{if(!dragging)return;const dx=event.clientX-lastX,dy=event.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;azimuth-=dx*.007;polar=THREE.MathUtils.clamp(polar+dy*.006,.28,Math.PI-.28);lastX=event.clientX;lastY=event.clientY;updateCamera();});
    renderer.domElement.addEventListener('pointerup',event=>{dragging=false;renderer.domElement.releasePointerCapture(event.pointerId);if(!moved)handlePick(event);});
    renderer.domElement.addEventListener('wheel',event=>{radius=THREE.MathUtils.clamp(radius+event.deltaY*.015,13,38);updateCamera();},{passive:true});
    function handlePick(event){pointer.x=event.clientX/innerWidth*2-1;pointer.y=-(event.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects([pieceGroup,boardGroup],true);for(const hit of hits){const piece=hit.object.userData.pieceRoot;if(piece){if(selectedPiece&&piece.userData.color!==currentTurn)moveSelected(piece.userData.file,piece.userData.rank,piece.userData.level);else if(piece.userData.color===currentTurn)selectPiece(piece);return;}if(hit.object.userData.kind==='square'){const{file,rank,level}=hit.object.userData;if(selectedPiece)moveSelected(file,rank,level);return;}}clearSelection();updateStatus('Select a piece');}
    document.querySelector('#resetView').addEventListener('click',()=>{azimuth=.68;polar=1.02;radius=24;updateCamera();});document.querySelector('#resetGame').addEventListener('click',setupPieces);

    const stars=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0x9fc9ff,size:.035,transparent:true,opacity:.42})),starPositions=[];
    for(let i=0;i<650;i++){const r=35+Math.random()*45,theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);starPositions.push(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));}stars.geometry.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));scene.add(stars);
    function animate(time){stars.rotation.y=time*.000012;renderer.render(scene,camera);requestAnimationFrame(animate);}requestAnimationFrame(animate);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  </script>
</body>
</html>
